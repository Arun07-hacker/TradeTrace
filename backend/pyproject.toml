[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradetrace-backend"
version = "0.1.0"
description = "TradeTrace Backend - AI Trading Research, Risk & Learning Assistant"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "TradeTrace Team" }
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning"
]
